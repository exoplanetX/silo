name: Quality and installed artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-check dependencies
        run: python -m pip install ".[dev,optional-backends]" build
      - name: Source quality checks
        run: python scripts/check_quality.py
      - name: Frozen old raw-reference verification
        run: python scripts/prototype/evidence.py --verify
      - name: Static reliability freeze and independent oracle verification
        run: python -m scripts.reliability.freeze
      - name: Build the shared current wheel and sdist once
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m scripts.reliability.artifacts --build --output outputs/reliability-ci/dist
      - name: Preserve shared candidate identities
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: current-candidate
          path: outputs/reliability-ci/dist/*
          if-no-files-found: error

  installed:
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        engine: [dense, sparse]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: current-candidate
          path: outputs/reliability-ci/dist
      - name: Fresh wheel and sdist environments outside source
        run: >-
          python -m scripts.reliability.artifacts
          --dist outputs/reliability-ci/dist
          --output outputs/reliability-ci/installed
          --engine ${{ matrix.engine }}
      - name: Preserve actual installed reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.engine }}
          path: outputs/reliability-ci/installed/*
          if-no-files-found: error

  external-format:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install only the current package for export
        run: python -m pip install .
      - name: External parser exact file semantics, no optimization
        run: >-
          python -m scripts.reliability.external
          --output outputs/reliability-ci/external/summary.json
      - name: Preserve external parse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-format
          path: outputs/reliability-ci/external/*
          if-no-files-found: error
